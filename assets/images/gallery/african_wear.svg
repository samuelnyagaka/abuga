  <rect width="600" height="450" fill="url(#afrBg)" />
  <!-- Modern Agbada / African Ceremonial Silhouette -->
  <path d="M 170,140 L 300,160 L 430,140 L 460,320 L 390,340 L 380,380 L 220,380 L 210,340 L 140,320 Z" fill="#292524" stroke="url(#goldEmb)" stroke-width="2" />
