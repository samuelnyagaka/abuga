    <polygon points="300,195 335,235 300,275 265,235" />
    <line x1="300" y1="165" x2="300" y2="310" stroke-width="3" />
    <line x1="240" y1="235" x2="360" y2="235" stroke-width="3" />
  </g>
  <!-- Title label -->
  <rect x="50" y="385" width="500" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="300" y="411" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CONTEMPORARY AFRICAN CEREMONIAL ATTIRE</text>
