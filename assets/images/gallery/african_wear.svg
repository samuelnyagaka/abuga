      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldEmb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
