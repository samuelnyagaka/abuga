<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#corpBg)" />
  <!-- Minimalist office silhouette / Corporate attire -->
  <path d="M 215,120 L 300,150 L 385,120 L 435,235 L 395,250 L 380,380 L 220,380 L 205,250 L 165,235 Z" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Lapel -->
  <polygon points="255,135 300,265 285,270 230,150" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="345,135 300,265 315,270 370,150" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Shirt & Silk Blue Tie -->
  <polygon points="280,140 300,155 320,140 310,205 290,205" fill="#f8fafc" />
  <polygon points="296,160 304,160 308,245 300,260 292,245" fill="#0284c7" />
  <!-- Pocket Square -->
  <line x1="250" y1="215" x2="275" y2="215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Title label -->
  <rect x="50" y="385" width="500" height="40" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="300" y="411" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">CORPORATE EXECUTIVE &amp; OFFICE STAFF APPAREL</text>
</svg>
